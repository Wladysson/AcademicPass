# Aplicacao
quarkus.application.name=identity-service
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Habilita JNDI para as consultas LDAP realizadas pelo Java
quarkus.naming.enable-jndi=true

# Redis - persistencia das sessoes
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}

# CORS - acesso do frontend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

LDAP_URL=ldap://localhost:389
LDAP_BASE_DN=dc=example,dc=org
LDAP_BIND_DN=cn=admin,dc=example,dc=org
LDAP_BIND_PASSWORD=admin123
LDAP_ALLOW_INSECURE=true
LDAP_ROLE_ATTRIBUTE=description

# Health checks
quarkus.smallrye-health.root-path=/health

# Documentacao da API
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true