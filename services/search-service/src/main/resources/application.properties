# Aplicação Quarkus
quarkus.application.name=search-service
quarkus.http.port=8083
quarkus.http.host=0.0.0.0

# Elasticsearch
elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
elasticsearch.index=${ELASTICSEARCH_INDEX:enade-questions}
elasticsearch.username=${ELASTICSEARCH_USERNAME:disabled}
elasticsearch.password=${ELASTICSEARCH_PASSWORD:disabled}

# Redis
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
search.cache.ttl-seconds=${SEARCH_CACHE_TTL_SECONDS:300}

# Identity Service
identity.validation-url=${IDENTITY_VALIDATION_URL:http://localhost:8080/api/v1/auth/validate}
identity.service-token=${IDENTITY_SERVICE_TOKEN:}

# Autenticação interna
identity.kerberos.enabled=${IDENTITY_KERBEROS_ENABLED:false}
identity.kerberos.service-principal=${IDENTITY_KERBEROS_SERVICE_PRINCIPAL:}
identity.kerberos.service-password=${IDENTITY_KERBEROS_SERVICE_PASSWORD:}
