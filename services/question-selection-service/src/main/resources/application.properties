# Identificação do serviço
quarkus.application.name=question-selection-service
quarkus.http.port=${PORT:8083}

# Redis
quarkus.redis.hosts=${REDIS_URL:redis://localhost:6379}
selection.ttl.seconds=${SELECTION_TTL_SECONDS:86400}

# Identity Service
identity.validation.url=${IDENTITY_VALIDATION_URL:http://localhost:8080/api/v1/auth/validate}

# Kerberos interno
kerberos.client.enabled=${KERBEROS_CLIENT_ENABLED:false}
kerberos.client.service-principal=${KERBEROS_CLIENT_SERVICE_PRINCIPAL:disabled}

# Health checks
quarkus.smallrye-health.root-path=/q/health

# OpenAPI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# Logs
quarkus.log.level=INFO
