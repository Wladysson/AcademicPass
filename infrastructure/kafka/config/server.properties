# Identificacao do broker e cluster KRaft
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

# Diretorio de dados
log.dirs=/var/lib/kafka/data

# Listeners
listeners=SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=SASL_PLAINTEXT://localhost:9092
listener.security.protocol.map=SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=SASL_PLAINTEXT
controller.listener.names=CONTROLLER

# Autenticacao SASL/GSSAPI
sasl.enabled.mechanisms=GSSAPI
sasl.mechanism.inter.broker.protocol=GSSAPI
sasl.kerberos.service.name=kafka

# Configuracao JAAS
listener.name.sasl_plaintext.gssapi.sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true doNotPrompt=true keyTab="/etc/security/keytabs/kafka.keytab" principal="kafka/localhost@ACADEMICPASS.LOCAL";

# Autorizacao
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=true
super.users=User:kafka/localhost@ACADEMICPASS.LOCAL

# Replicacao e tolerancia a falhas
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Criacao e gerenciamento de topicos
auto.create.topics.enable=false
num.partitions=3

# Retencao de mensagens
log.retention.hours=168
log.retention.check.interval.ms=300000
log.segment.bytes=1073741824

# Retencao de offsets e transacoes
offsets.retention.minutes=10080
transaction.max.timeout.ms=900000

# Tamanho e tempo das requisicoes
message.max.bytes=52428800
replica.fetch.max.bytes=52428800
socket.request.max.bytes=104857600
request.timeout.ms=30000
connections.max.idle.ms=600000

# Recuperacao e consistencia
unclean.leader.election.enable=false
controlled.shutdown.enable=true
controlled.shutdown.max.retries=3

# Configuracoes de rede
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400

# Configuracoes de log
log.cleaner.enable=true
log.cleaner.threads=1
