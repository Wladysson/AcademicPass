KafkaServer {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    doNotPrompt=true
    useTicketCache=false
    keyTab="/etc/security/keytabs/kafka.keytab"
    principal="kafka/localhost@ACADEMICPASS.LOCAL"
    isInitiator=false
    debug=false;
};

KafkaClient {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    doNotPrompt=true
    useTicketCache=false
    keyTab="/etc/security/keytabs/kafka.keytab"
    principal="kafka/localhost@ACADEMICPASS.LOCAL"
    isInitiator=true
    debug=false;
};
