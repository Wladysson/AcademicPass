worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/api-gateway/config/upstreams.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    log_format academicpass
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log academicpass;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/css
        text/plain
        text/xml;

    # Serviços Java / Quarkus
    upstream identity_service {
        server identity-service:8081;
        keepalive 16;
    }

    upstream search_service {
        server search-service:8082;
        keepalive 16;
    }

    upstream question_selection_service {
        server question-selection-service:8083;
        keepalive 16;
    }

    upstream simulado_service {
        server simulado-service:8084;
        keepalive 16;
    }

    # Serviços Python
    upstream ingestion_service {
        server ingestion-service:8091;
        keepalive 16;
    }

    upstream extraction_service {
        server extraction-service:8092;
        keepalive 16;
    }

    upstream indexing_service {
        server indexing-service:8093;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;

        # Disponibilidade do gateway
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","service":"academicpass-api-gateway"}';
        }

        # Identidade e autenticação
        location /api/v1/auth/ {
            proxy_pass http://identity_service;
        }

        location /api/v1/identity/ {
            proxy_pass http://identity_service;
        }

        # Busca e agregações
        location /api/v1/questions {
            proxy_pass http://search_service;
        }

        location /api/v1/aggregations {
            proxy_pass http://search_service;
        }

        # Seleção de questões
        location /api/v1/selections {
            proxy_pass http://question_selection_service;
        }

        # Simulados
        location /api/v1/simulados {
            proxy_pass http://simulado_service;
        }

        # Ingestão de documentos
        location /api/v1/ingestion/ {
            proxy_pass http://ingestion_service;
        }

        # Extração de documentos
        location /api/v1/extraction/ {
            proxy_pass http://extraction_service;
        }

        # Indexação
        location /api/v1/indexing/ {
            proxy_pass http://indexing_service;
        }

        # Documentação Swagger UI
        location /api/docs/identity/ {
            proxy_pass http://identity_service/q/swagger-ui/;
        }

        location /api/docs/search/ {
            proxy_pass http://search_service/q/swagger-ui/;
        }

        location /api/docs/selections/ {
            proxy_pass http://question_selection_service/q/swagger-ui/;
        }

        location /api/docs/simulados/ {
            proxy_pass http://simulado_service/q/swagger-ui/;
        }

        # Rotas não reconhecidas
        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Rota não encontrada."}';
        }
    }
}
