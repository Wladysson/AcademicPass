# Identificação e rede
port 6379
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Processamento
databases 16
daemonize no
supervised no

# Autenticação
# Defina REDIS_PASSWORD por variável de ambiente no ambiente de execução
# e configure requirepass por mecanismo seguro de inicialização.
# Não coloque credenciais diretamente neste arquivo.

# Memória
maxmemory 256mb
maxmemory-policy volatile-lru
maxmemory-samples 10

# Persistência RDB
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Persistência AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# Expiração e eviction
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# Clientes e conexões
maxclients 10000

# Logs
loglevel notice
logfile ""

# Latência e desempenho
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# Segurança de comandos administrativos
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
