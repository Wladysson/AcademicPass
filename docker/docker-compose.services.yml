name: academicpass

services:
  # ==========================================
  # IDENTITY SERVICE
  # ==========================================

  identity-service:
    container_name: academicpass-identity-service
    build:
      context: ../services/identity-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8081
      LDAP_URL: ${LDAP_URL:-ldap://ldap:389}
      LDAP_ALLOW_INSECURE: ${LDAP_ALLOW_INSECURE:-true}
      REDIS_HOSTS: ${REDIS_HOSTS:-redis://:academicpass-local@redis:6379}
    networks:
      - academicpass-network

  # ==========================================
  # INGESTION SERVICE
  # ==========================================

  ingestion-service:
    container_name: academicpass-ingestion-service
    build:
      context: ../services/ingestion-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-academicpass}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-academicpass-local}
    networks:
      - academicpass-network

  # ==========================================
  # EXTRACTION SERVICE
  # ==========================================

  extraction-service:
    container_name: academicpass-extraction-service
    build:
      context: ../services/extraction-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-academicpass}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-academicpass-local}
    networks:
      - academicpass-network

  # ==========================================
  # INDEXING SERVICE
  # ==========================================

  indexing-service:
    container_name: academicpass-indexing-service
    build:
      context: ../services/indexing-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
    networks:
      - academicpass-network

  # ==========================================
  # SEARCH SERVICE
  # ==========================================

  search-service:
    container_name: academicpass-search-service
    build:
      context: ../services/search-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8082
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
      REDIS_HOSTS: ${REDIS_HOSTS:-redis://:academicpass-local@redis:6379}
    networks:
      - academicpass-network

  # ==========================================
  # QUESTION SELECTION SERVICE
  # ==========================================

  question-selection-service:
    container_name: academicpass-question-selection-service
    build:
      context: ../services/question-selection-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8083
      REDIS_HOSTS: ${REDIS_HOSTS:-redis://:academicpass-local@redis:6379}
    networks:
      - academicpass-network

  # ==========================================
  # SIMULADO SERVICE
  # ==========================================

  simulado-service:
    container_name: academicpass-simulado-service
    build:
      context: ../services/simulado-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8084
      REDIS_HOSTS: ${REDIS_HOSTS:-redis://:academicpass-local@redis:6379}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    networks:
      - academicpass-network

  # ==========================================
  # API GATEWAY
  # ==========================================

  api-gateway:
    container_name: academicpass-api-gateway
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../infra/api-gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/api-gateway/nginx/config:/etc/nginx/config:ro
    networks:
      - academicpass-network

  # ==========================================
  # WEB APPLICATION
  # ==========================================

  web:
    container_name: academicpass-web
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    networks:
      - academicpass-network

# ==========================================
# NETWORK
# ==========================================

networks:
  academicpass-network:
    name: academicpass-network
    external: true
